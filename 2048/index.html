<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <script src="loader.js" defer></script>
    <link href="style.css" rel="stylesheet"/>
    <title>2048</title>
  </head>
  <body>
    <div id="background">
        <div id="backgroundTone"></div>
    </div>
    <div id="popUpFrame" class="frame">
      <div id="popUp">
        <div id="popUpMessage"></div>
        <div id="popUpOptions">
          <div id="popUpReset" class="button popUp">
            <img src="reset.png"></img>
          </div>
          <img id="popUpMenu" class="button popUp marginLeft" src="menu.png"></img>
          <div id="popUpContinue" class="button popUp marginLeft">
            <img src="continue.png"></img>
          </div>
        </div>
      </div>
    </div>
    <div id="content">
      <div id="frame2048" class="frame">
        <div id="screen2048">
          <div id="menu2048">
            <div class="menuButtons">
              <div id="undo2048" class="button c2048 marginLeft">
                <img src="undo.png"></img>
              </div>
              <img id="openPopUp2048" class="button c2048" src="menu.png"></img>
            </div>
            <div id="menuScores">
              <div class="scoreText">
                <span class="scoreNow">Score:</span>
                <span class="highScore">Highscore:</span>
              </div>
              <div class="scoreText">
                <span class="scoreNow" id="scoreNow">0</span>
                <span class="highScore" id="highScore">0</span>
              </div>
            </div>
          </div>
          <div id="container">
          </div>
        </div>
      </div>
      <div id="frameCreateNew" class="frame">
        <div id="createNewContainer">
          <div class="rowContainer">
            <span class="newSize" style="margin: 0 1.5vh 0 2vh;">
              width
            <span style="margin: 0 2vh 0 3vh">X</span>
              height
            </span>
          </div>
          <div class="rowContainer">
            <choice id="width" target="4">
            </choice>
            <span class="newSize">
              <span>X</span>
            </span>
            <choice id="height" target="4">
            </choice>
          </div>
          <div class="rowContainer" style="margin-top: 20vh;">
            <div id="returnMenu" class="button">
              <img src="menu.png"></img>
            </div>
            <div id="createGame" class="button marginLeft">
              <img src="continue.png"></img>
            </div>
          </div>
        </div>
      </div>
      <div id="frameMenu" class="frame">
        <div id="topMenu" class="saveMenu">
          <div class="menuButtons menu">
            <div id="header" class="menu">
              Your save games.
            </div>
          </div>
        </div>
        <div id="saveTileContainer">
        </div>
      </div>
    </div>
  </body>
</html>
